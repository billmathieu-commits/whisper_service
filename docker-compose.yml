version: '3.8'

services:
  whisper-service:
    build: .
    container_name: whisper-stt-service
    ports:
      - "8000:8000"
    environment:
      - MODEL_SIZE=large  # 可选: tiny, base, small, medium, large
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # 挂载缓存目录以加速模型加载
      # Whisper 模型缓存
      - whisper-cache:/root/.cache/whisper
      # Chat TTS 模型缓存
      - chattts-cache:/root/.cache/huggingface
      # 临时文件目录
      - tmp-cache:/tmp
    restart: unless-stopped

volumes:
  whisper-cache:
    driver: local
  chattts-cache:
    driver: local
  tmp-cache:
    driver: local