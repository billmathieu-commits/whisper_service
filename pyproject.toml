[project]
name = "whisper-service"
version = "0.1.0"
description = "FastAPI + Whisper STT service with GPU support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "openai-whisper>=20231117",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "edge-tts>=6.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
